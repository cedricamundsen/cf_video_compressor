name: cf_video_compressor
description: "CombatFlux on-device video compression with the platform's hardware encoder (Android: Media3 Transformer, iOS: AVFoundation AVAssetReader/AVAssetWriter)."
version: 0.2.0
publish_to: 'none'

environment:
  sdk: ^3.10.7
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.combatflux.cf_video_compressor
        pluginClass: CfVideoCompressorPlugin
      # Same CfVideoCompressorPlatform contract (channels, methods, codes).
      ios:
        pluginClass: CfVideoCompressorPlugin
