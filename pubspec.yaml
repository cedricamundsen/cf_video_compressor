name: cf_video_compressor
description: "CombatFlux Phase B0 POC: on-device video compression with the platform's hardware encoder (Android: Media3 Transformer). Isolated feasibility test; not used by the production app."
version: 0.0.1-poc
publish_to: 'none'

environment:
  sdk: ^3.10.7
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.combatflux.cf_video_compressor
        pluginClass: CfVideoCompressorPlugin
      # iOS (AVAssetReader / AVAssetWriter) plugs in here later behind the
      # same CfVideoCompressorPlatform interface. Not part of Phase B0.
